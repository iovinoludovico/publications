name: Update publications.bib from ORCID

on:
  schedule:
    - cron: "0 5 * * 1"   # ogni lunedì alle 05:00 UTC
  workflow_dispatch:       # avvio manuale dal tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build publications.bib
        env:
          ORCID_ID: ${{ vars.ORCID_ID }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python scripts/orcid_to_bib.py

      - name: Commit if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.bib cache.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "chore: update publications.bib from ORCID ($(date -u +%Y-%m-%d))"
            git push
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made with GITHUB_TOKEN don't trigger notify-site.yml, so notify the website here.
      - name: Notify website
        if: steps.commit.outputs.sha != ''
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set; the site will pick up the change at its nightly rebuild."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/iovinoludovico/mywebsite/dispatches \
            -d "{\"event_type\":\"publications-updated\",\"client_payload\":{\"sha\":\"$SHA\"}}"
