name: Update publications.bib from ORCID

on:
  schedule:
    - cron: "0 5 * * 1"   # ogni lunedì alle 05:00 UTC
  workflow_dispatch:       # avvio manuale dal tab Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Build publications.bib
        env:
          ORCID_ID: ${{ vars.ORCID_ID }}
          CROSSREF_MAILTO: ${{ vars.CROSSREF_MAILTO }}
        run: python scripts/orcid_to_bib.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add publications.bib cache.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica"
          else
            git commit -m "chore: update publications.bib from ORCID ($(date -u +%Y-%m-%d))"
            git push
          fi
