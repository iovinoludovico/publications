name: Notify website

# Rebuilds ludovicoiovino.it when publications.bib is edited by hand.
# Commits made by "Update publications.bib from ORCID" use GITHUB_TOKEN and do not
# trigger this workflow, so that workflow notifies the site itself.
on:
  push:
    branches: [main]
    paths: [publications.bib]
  workflow_dispatch:

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to the website
        env:
          TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::SITE_DISPATCH_TOKEN is not set; the site will pick up the change at its nightly rebuild."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            https://api.github.com/repos/iovinoludovico/mywebsite/dispatches \
            -d "{\"event_type\":\"publications-updated\",\"client_payload\":{\"sha\":\"$SHA\"}}"
